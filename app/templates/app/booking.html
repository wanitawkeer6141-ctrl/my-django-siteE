<!DOCTYPE html>
<html>
<head>
    <title>Booking</title>

    <style>
        body{
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
        }

        h2{
            text-align: center;
            color: white;
            padding: 20px;
        }

        form{
            background: white;
            width: 350px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .asa{
            text-align: center;
            margin-top: 15px;
        }

        button{
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background-color: #0056b3;
        }

        input, select, textarea{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>

</head>
<body>

<h2>Book a Room</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="asa">
        <button type="submit">Book Now</button>
    </div>
</form>

</body>
</html>
