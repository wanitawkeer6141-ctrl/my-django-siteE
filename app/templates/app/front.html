<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selection</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6516514099051839"
     crossorigin="anonymous"></script>

<style>
body {
    margin: 0;
    padding: 0;

    background-image: url("https://media.radissonhotels.net/image/press-releases--loyalty/exterior/16256-151404-f78707612_3xl.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}


body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 0;
}

.container {
    position: relative;
    z-index: 1;
    text-align: center;
}

.box, .cap {
    margin: 10px auto;
    text-align: center;
    color: white;
    background-color: red;
    padding: 12px 20px;
    border-radius: 20px;
    width: 200px;
    font-weight: bold;
}

.box a, .cap a {
    text-decoration: none;
    color: white;
    display: block;
}

.box:hover, .cap:hover {
    background-color: darkred;
    transform: scale(1.05);
    transition: 0.3s;
}
</style>
</head>

<body>

<div class="container">
    <div class="box">
        <a href="{% url 'home' %}">HOTELS in Pahalgam</a>
    </div>

    <div class="cap">
        <a href="{% url 'taa' %}">Srinagar</a>
    </div>
</div>

</body>
</html>
