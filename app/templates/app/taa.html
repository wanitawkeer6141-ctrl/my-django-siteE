<!DOCTYPE html>

<head>

    <title>Srinagar</title>

    <style>
        body{
        margin:0;
        font-family: Arial, sans-serif;
        border: 6px solid;
        border-image: linear-gradient(to right, blue, purple) 1;
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #4facfe, #00f2);
}

 


        .container {
            margin-top: 50px;
        }
        .row{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin:20px 0;
}

.row img{
    width:360px;
    height:220px;
    object-fit:cover;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}


.link-box{
    text-align:center;
    margin:15px 0;
}

.link-box a{
    display:inline-block;
    background:#00796b;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    color:white;
    padding:10px 16px;
    margin:5px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

.link-box a:hover{
    background:#004d40;
    transform:scale(1.05);
}
.header {
    background: linear-gradient(to right, #00796b, #26a69a); 
    color: white; 
    font-size: 28px;
    font-weight: bold; 
    text-align: center;
    padding: 15px 0;
    width: 300px; 
    margin: 20px auto;
    border-radius: 18px;

    
    max-width: 200px;
    width: 90%;

}
.font {
    position: absolute;
    top: 10px;
    left: 10px;
}

.font a {
    text-decoration: none;
    background-color: #00796b;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: bold;
    display: inline-block;
    transition: 0.3s;
}

.font a:hover {
    background-color: #004d40;
    transform: scale(1.05);
}
    </style>
</head>

<body>
    <div class="header">Srinagar Trip</div>
